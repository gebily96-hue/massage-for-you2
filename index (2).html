<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>write our boy name</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14161f;--ink:#ece6da;--mute:#9a9486;--line:#3a3d4d;--acc:#c9a66b;--err:#d98a8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3eee4;--ink:#2a2620;--mute:#7a7365;--line:#cfc6b4;--acc:#8a6a2f;--err:#a84646}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Amiri','Traditional Arabic',serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lock{width:100%;max-width:380px;text-align:center}
.lock h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:1.5rem;letter-spacing:.04em;margin:0 0 28px;direction:ltr}
input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;font-size:1.6rem;text-align:center;padding:10px 4px;outline:none;transition:border-color .2s}
input:focus{border-color:var(--acc)}
.msg{min-height:1.6em;margin-top:14px;color:var(--err);font-size:1.05rem}
.lock.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
article{display:none;width:100%;max-width:34rem}
article p{font-size:1.35rem;line-height:2.1;margin:0 0 1.3em;text-wrap:pretty}
article.on{display:block;animation:fd 1.4s ease both}
@keyframes fd{from{opacity:0}to{opacity:1}}
body.open{align-items:flex-start;padding-top:48px;padding-bottom:64px}
@media (prefers-reduced-motion:reduce){article.on,.lock.shake{animation:none}}
</style>
</head>
<body>
<div class="lock" id="lock">
  <h1>write our boy name</h1>
  <input id="in" type="text" dir="rtl" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="write our boy name">
  <div class="msg" id="msg" role="status"></div>
</div>
<article id="art"></article>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=s=>{s=s.trim().toLowerCase().replace(/[\u064B-\u065F\u0670\u0640\s]/g,'').replace(/ى/g,'ي').replace(/ي{2,}/g,'ي');
  return ['yahya','yahia','yehia','yehya'].includes(s)?'يحي':s};
async function tryOpen(v){
  const k=norm(v); if(!k) return false;
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(k),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(S),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(I)},key,b(C));
    return new TextDecoder().decode(buf);
  }catch(e){return false}
}
const inp=document.getElementById('in'),msg=document.getElementById('msg'),lock=document.getElementById('lock'),art=document.getElementById('art');
let busy=false,t;
inp.addEventListener('input',()=>{
  clearTimeout(t);
  t=setTimeout(async()=>{
    if(busy) return; busy=true;
    const txt=await tryOpen(inp.value);
    busy=false;
    if(txt){
      txt.split(/\n\s*\n/).forEach(p=>{const e=document.createElement('p');e.textContent=p;art.appendChild(e)});
      lock.style.display='none';art.classList.add('on');document.body.classList.add('open');
    }else if(inp.value.trim().length>=3){
      msg.textContent='مش الاسم ده، جرّب تاني';
      lock.classList.remove('shake');void lock.offsetWidth;lock.classList.add('shake');
    }else msg.textContent='';
  },350);
});
inp.addEventListener('keydown',e=>{if(e.key==='Enter') inp.dispatchEvent(new Event('input'))});
